name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veredoc
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/veredoc
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      ANTHROPIC_API_KEY: test-anthropic-key
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_SECRET: ci-admin-secret
      JOBS_SECRET: ci-jobs-secret
      SCRAPERAPI_KEY: ci-scraper-key
      BREVO_API_KEY: ci-brevo-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint hardening files
        run: >-
          pnpm exec eslint
          app/api/documents/upload/route.ts
          'app/api/documents/[id]/route.ts'
          app/api/jobs/process-analysis/route.ts
          lib/ai/validate.ts
          lib/documents/upload-validation.ts
          lib/jobs/process-document.ts
          tests/validation.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
