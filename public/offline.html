<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B4FD8">
  <title>Veredoc — Offline</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fc; color: #111827; }
    main { width: min(100%, 420px); text-align: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 24px; padding: 32px 24px; box-shadow: 0 12px 36px rgba(17, 24, 39, .08); }
    img { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.2; }
    p { margin: 0; color: #4b5563; line-height: 1.6; }
    button { margin-top: 24px; min-height: 48px; border: 0; border-radius: 14px; padding: 0 20px; background: #1B4FD8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="">
    <h1>Sei offline</h1>
    <p>Veredoc non salva in cache documenti, analisi o dati dell'account. Riconnettiti per continuare in sicurezza.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
